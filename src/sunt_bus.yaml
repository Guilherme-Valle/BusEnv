# Configuration for MARLlib custom environment: sunt_bus
env: sunt_bus

env_args:
  network_path: "viz/graph_gtfs_fev_2024.gpickle"
  obs_dir: "training_observation"
  actions_amount: 3
  max_steps: 1000000
  num_buses: 5
  regime_switch_every: 50
  use_context: true
  avg_travel_time_AB_file: "avg_travel_time_AB.pkl"
  future_demand_at_B_file: "future_demand_at_B.pkl"
  occupancy_rate_file: "occupancy_rate.pkl"
  uptime_normalized_file: "uptime_normalized.pkl"
  real_routes_file: "real_routes.pkl"
  route_metadata_file: "route_metadata.pkl"

mask_flag: False
global_state_flag: False
opp_action_in_cc: False
fixed_batch_timesteps: 1000
agent_level_batch_update: False
